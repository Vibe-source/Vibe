# Standalone for now — empty workspace so this crate does not join the parent
# `core/` workspace until the lead wires it in at integration.
[workspace]

[package]
name = "vibe_core_store"
version = "0.1.0"
description = "Legacy read-only messages view plus sealed core_messages_v1 write store."
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"

[dependencies]
# Bundled: never link the system SQLite. Read-only open is enforced in code.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
