# Standalone until integration: an empty `[workspace]` table keeps this crate
# out of the parent workspace so it cannot break `cargo test` in `core/` while
# it is being written. The lead adds it to `members` at integration.
[workspace]

[package]
name = "vibe_core_ffi"
version = "0.1.0"
description = "UniFFI boundary for vibe_core: one worker thread, a command queue, and a panic-safe FFI surface. No synchronous read API by design."
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[lib]
# `staticlib` is what the XCFramework links; `lib` is what the tests use.
crate-type = ["staticlib", "cdylib", "lib"]
name = "vibe_core_ffi"

[dependencies]
vibe_core = { path = "../vibe_core" }
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
uniffi = { version = "0.28", features = ["bindgen-tests"] }

[lints.rust]
# Same posture as the parent workspace: the whole point of choosing Rust here
# was memory safety, so a hand-written unsafe block would be self-defeating.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
too_many_lines = "allow"

[profile.release]
lto = true
codegen-units = 1
# Never `abort`: a core panic must degrade to the Swift path, not kill the host.
panic = "unwind"
