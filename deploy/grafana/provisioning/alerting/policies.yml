apiVersion: 1

# Critical pages fast and repeats hourly; warnings batch. Grouping by alertname
# keeps a whole-host failure to one message instead of one per service.
policies:
  - orgId: 1
    receiver: vibe-email
    group_by: [alertname, job]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 6h
    routes:
      - receiver: vibe-email
        object_matchers: [["severity", "=", "critical"]]
        group_wait: 10s
        repeat_interval: 1h
