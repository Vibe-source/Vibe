; DB names/roles aren't secret, so this file is static. Passwords live only in
; userlist.txt, generated at container start by entrypoint.sh from env.
[databases]
vibe_core = host=postgres port=5432 dbname=vibe_core
vibe_agents = host=postgres port=5432 dbname=vibe_agents

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
pidfile = /run/pgbouncer/pgbouncer.pid
pool_mode = transaction
default_pool_size = 40
reserve_pool_size = 10
reserve_pool_timeout = 3

# Hard ceiling below postgres max_connections (200), so the pool can never be
# the thing that exhausts the server.
max_db_connections = 150
max_client_conn = 500

server_idle_timeout = 60
server_lifetime = 3600
# Fail a starved client instead of queueing it behind a stuck pool forever.
query_wait_timeout = 30

# Reuses a userlist.txt account, so no extra credential. No admin_users: the
# admin console can PAUSE and KILL, which is not a monitoring capability.
# podman exec deploy_pgbouncer_1 psql -p 6432 -U vibe_core_app pgbouncer -c "SHOW POOLS"
stats_users = vibe_core_app

ignore_startup_parameters = extra_float_digits,statement_timeout
