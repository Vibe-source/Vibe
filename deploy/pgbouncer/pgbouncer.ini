; DB names/roles aren't secret, so this file is static. Passwords live only in
; userlist.txt, generated at container start by entrypoint.sh from env.
[databases]
vibe_core = host=postgres port=5432 dbname=vibe_core
vibe_agents = host=postgres port=5432 dbname=vibe_agents

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
pidfile = /run/pgbouncer/pgbouncer.pid
pool_mode = transaction
default_pool_size = 40
max_client_conn = 500
server_idle_timeout = 60
ignore_startup_parameters = extra_float_digits,statement_timeout
