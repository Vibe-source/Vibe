# Cache / rate-limit backend only — Postgres is the source of truth, so no
# persistence is needed or wanted here.
maxmemory 256mb
maxmemory-policy volatile-ttl
appendonly no
save ""

# Reachable from other containers on the internal network; auth (requirepass)
# is set by entrypoint.sh from VALKEY_PASSWORD, not hardcoded in this file.
bind 0.0.0.0
protected-mode no
