# Tuned for a 4-8 GB VPS running postgres + pgbouncer + core + agent-runtime
# alongside it. Re-tune shared_buffers/effective_cache_size if the box is bigger.

listen_addresses = '*'
port = 5432

max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

wal_level = replica
checkpoint_completion_target = 0.9
random_page_cost = 1.1

shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500

password_encryption = scram-sha-256

# TLS terminates at Caddy; postgres is only reachable on the internal compose
# network, never published. To enable in-cluster TLS: mount a cert/key pair
# and set ssl = on plus ssl_cert_file/ssl_key_file below.
ssl = off
