# Tuned for a 4-8 GB VPS running postgres + pgbouncer + core + agent-runtime
# alongside it. Re-tune shared_buffers/effective_cache_size if the box is bigger.

listen_addresses = '*'
port = 5432

max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# A standby can attach without a restart. archive_mode stays off until the
# backup bucket exists — a failing archive_command retains WAL until the disk fills.
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
#archive_mode = on
#archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
#archive_timeout = 300

checkpoint_completion_target = 0.9
random_page_cost = 1.1

# Pooled connections are a fixed resource: nothing may hold one indefinitely.
statement_timeout = 120s
idle_in_transaction_session_timeout = 60s

# Chat tables churn; the defaults let dead tuples pile up between vacuums.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
track_io_timing = on
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = 1000

shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500

password_encryption = scram-sha-256

# TLS terminates at Caddy; postgres is only reachable on the internal compose
# network, never published. To enable in-cluster TLS: mount a cert/key pair
# and set ssl = on plus ssl_cert_file/ssl_key_file below.
ssl = off
