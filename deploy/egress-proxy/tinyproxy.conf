# The only way out of sandbox-net. Removing the Filter block = open egress (see README.md).
User nobody
Group nogroup

Port 3128
Listen 0.0.0.0
Timeout 600

# SANDBOX_SUBNET_PLACEHOLDER: infra worker fills this with sandbox-net's real CIDR.
Allow 172.30.0.0/16

# tinyproxy 1.11 is single-process: StartServers/MinSpare/MaxSpare are obsolete and warn.
MaxClients 64

# HTTPS (CONNECT) and plain HTTP only — no other ports leave the sandbox.
ConnectPort 443
ConnectPort 80

# Denylist mode: `filter` lists what is BLOCKED (private ranges, compose service names);
# the open web is allowed so agents can browse. Flip to Yes for a strict allowlist.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny No
FilterExtended On
FilterCaseSensitive No

DisableViaHeader Yes

# No PidFile: the image has no /var/run/tinyproxy and tinyproxy 1.11 exits if it cannot write one.
LogLevel Info
Syslog On
