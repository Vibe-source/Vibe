[package]
name = "vibe-sandbox-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Rust gateway: the only process allowed to touch the sandbox container runtime"
license = "UNLICENSED"
publish = false

[[bin]]
name = "sandbox-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
bollard = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.23"
anyhow = "1"
thiserror = "2"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
serde_urlencoded = "0.7"

[profile.release]
opt-level = 2
strip = true
